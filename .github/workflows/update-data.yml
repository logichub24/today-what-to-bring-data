name: Update live data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch data
        env:
          PUBLIC_DATA_SERVICE_KEY: ${{ secrets.PUBLIC_DATA_SERVICE_KEY }}
        run: |
          python -c "import json; from pathlib import Path; import server; output = Path('data/today.json'); output.parent.mkdir(parents=True, exist_ok=True); output.write_text(json.dumps(server.live_data(), ensure_ascii=False), encoding='utf-8')"
      - name: Publish data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/today.json
          git diff --cached --quiet || (git commit -m 'Update live data' && git push)
